{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AdPulse Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}
    {% endblock %}
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-box">AP</div>
                <h1 class="brand-name">AdPulse</h1>
            </div>
            <nav>
                <ul>
                    <li class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                        <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
                    </li>

                    <li class="{% if request.resolver_match.url_name == 'new_and_repeat' %}active{% endif %}">
                        <a href="{% url 'new_and_repeat' %}"><i class="fa-solid fa-users"></i> New & Repeat Cust</a>
                    </li>

                    <li class="{% if request.resolver_match.url_name == 'audience' %}active{% endif %}">
                        <a href="{% url 'audience' %}"><i class="fa-solid fa-bullseye"></i> Audience and Reach Frequency</a>
                    </li>

                    <li class="{% if request.resolver_match.url_name == 'path_analysis' %}active{% endif %}">
                        <a href="{% url 'path_analysis' %}"><i class="fa-solid fa-route"></i> Path Analysis</a>
                    </li>

                    <li class="{% if request.resolver_match.url_name == 'ad_overlap' %}active{% endif %}">
                        <a href="{% url 'ad_overlap' %}"><i class="fa-solid fa-layer-group"></i> Ad Type Overlap</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            
            {% block content %}
            {% endblock %}

            <div class="footer-info">
                <button class="help-btn">?</button>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    {% block scripts %}
    {% endblock %}

</body>
</html>
