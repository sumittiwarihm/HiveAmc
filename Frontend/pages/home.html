<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdPulse Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/homeStyles.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-box">AP</div>
                <h1 class="brand-name">AdPulse</h1>
            </div>
            <nav>
                <ul>
                    <li class="active"><a href="home.html"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="newAndRepeat.html"><i class="fa-solid fa-users"></i> New & Repeat Cust</a></li>
                    <li><a href="audienceAndreach.html"><i class="fa-solid fa-bullseye"></i> Audience and Reach Frequency</a></li>
                    <li><a href="pathAnalysis.html"><i class="fa-solid fa-route"></i> Path Analysis</a></li>
                    <li><a href="adTypeOverlap.html"><i class="fa-solid fa-layer-group"></i> Ad Type Overlap</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="cookie-btn">Manage cookies or opt out</button>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="dashboard-header">
                <div class="header-left">
                    <h2>Hello, User</h2>
                    <p class="current-date">Thursday, December 18, 2025</p>
                </div>
                
                <div class="date-picker-container">
                    <div class="date-trigger" id="dateTrigger">
                        <i class="fa-regular fa-calendar"></i>
                        <span id="selectedRangeText">Nov 18, 2025 - Dec 18, 2025</span>
                    </div>

                    <div class="date-dropdown" id="dateDropdown">
                        <div class="date-presets">
                            <button class="preset-btn" data-range="7">Last 7 days</button>
                            <button class="preset-btn" data-range="30">Last 30 days</button>
                            <button class="preset-btn" data-range="90">Last 3 months</button>
                        </div>

                        <div class="calendar-nav">
                            <button id="prevMonth"><i class="fa-solid fa-chevron-left"></i></button>
                            <div class="month-labels">
                                <span id="monthLabel1">December 2025</span>
                                <span id="monthLabel2">January 2026</span>
                            </div>
                            <button id="nextMonth"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>

                        <div class="calendar-wrapper">
                            <div class="month-grid" id="calendar1"></div>
                            <div class="month-grid" id="calendar2"></div>
                        </div>
                        
                        <div class="date-actions">
                            <button class="apply-btn" id="applyDateBtn">Apply</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="summary-section">
                <div class="card summary-card">
                    <h3 class="red-text">Spends</h3>
                    <div class="value" id="spends-val">₹1,26,000</div>
                </div>
                <div class="card summary-card">
                    <h3 class="red-text">Orders</h3>
                    <div class="value" id="orders-val">4,200</div>
                </div>
                <div class="card summary-card">
                    <h3 class="red-text">Revenue</h3>
                    <div class="value" id="revenue-val">₹9,60,000</div>
                </div>
            </section>

            <section class="charts-section">
                <div class="card chart-card">
                    <h3>Spends</h3>
                    <div class="chart-container"><canvas id="spendsChart"></canvas></div>
                </div>
                <div class="card chart-card">
                    <h3>Orders</h3>
                    <div class="chart-container"><canvas id="ordersChart"></canvas></div>
                </div>
                <div class="card chart-card">
                    <h3>Revenue</h3>
                    <div class="chart-container"><canvas id="revenueChart"></canvas></div>
                </div>
            </section>

            <div class="footer-info">
                <button class="help-btn">?</button>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../assets/js/homeScript.js"></script>
</body>
</html>
